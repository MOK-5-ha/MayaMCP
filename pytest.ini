[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    -v
# Custom CLI options:
# --force-rebuild: Force expensive rebuilds (Memvid store, etc.) - defaults to False for CI efficiency
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    memvid: marks tests related to Memvid functionality
    rag: marks tests related to RAG functionality
    llm: marks tests related to LLM functionality
    ui: marks tests related to UI functionality
filterwarnings =
    ignore::DeprecationWarning:websockets.*:
    ignore::DeprecationWarning:gradio.*:
    ignore::DeprecationWarning:gradio_client.*:
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\.testclient:
    ignore:BaseAgentConfig is deprecated and will be removed.*:DeprecationWarning:
    ignore:\[EXPERIMENTAL\].*:UserWarning:google\.adk\..*:
    ignore:Passing (nodeid|baseid) to .*:pytest.PytestRemovedIn10Warning:
    ignore:The parameters have been moved from the Blocks constructor to the launch\(\) method in Gradio 6\.0.*:UserWarning:
    ignore:.*tag was found in the content of a `gr\.HTML` component.*:UserWarning:gradio.*: