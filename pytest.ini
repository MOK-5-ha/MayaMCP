[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    -v
# Custom CLI options:
# --force-rebuild: Force expensive rebuilds (Memvid store, etc.) - defaults to False for CI efficiency
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    memvid: marks tests related to Memvid functionality
    rag: marks tests related to RAG functionality
    llm: marks tests related to LLM functionality
    bdd: marks tests as BDD acceptance tests
filterwarnings =
    ignore::DeprecationWarning:websockets.*:
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\.testclient:
    ignore:BaseAgentConfig is deprecated and will be removed.*:DeprecationWarning:
    ignore:\[EXPERIMENTAL\].*:UserWarning:google\.adk\..*:
    ignore:Passing (nodeid|baseid) to .*:pytest.PytestRemovedIn10Warning:
    ignore:_pytest.python.CallSpec2 has been renamed to CallSpec.*:pytest.PytestRemovedIn10Warning:anyio\.pytest_plugin:
    # Scoped third-party ResourceWarnings: subprocess pipes closed by CPython GC during
    # server fixture cleanup and background thread execution in specific test suites.
    ignore:unclosed file <_io\.TextIOWrapper.*:ResourceWarning:tests\.unit\.test_trace_instrumentation.*:
    ignore:unclosed file <_io\.TextIOWrapper.*:ResourceWarning:tests\.integration\.test_server_e2e.*: