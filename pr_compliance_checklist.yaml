# PR Compliance Checklist for MayaMCP (Qodo Code Review)

checklists:
  - id: vertex-ai-mode-mandatory-paid-tier
    name: Mandatory 100% GCP Vertex AI Mode (Paid Tier)
    rules:
      - "No GEMINI_API_KEY, LLM_API_KEY, or BACKUP_LLM_API_KEY environment variables or code paths."
      - "Strict requirement of GCP_PROJECT or GOOGLE_CLOUD_PROJECT."
      - "genai.Client initialized strictly with vertexai=True, project, location via src/llm/client.py."
      - "GEMINI_TIER locked to paid (high-throughput quota via GCP billing credits)."

  - id: strict-async-non-blocking-io
    name: Strict Non-Blocking Async I/O
    rules:
      - "No synchronous blocking network calls inside backend event loops."
      - "Use async clients or offload blocking sync I/O via asyncio.to_thread."

  - id: graceful-fallback-chain
    name: Graceful Degradation & Fallback Chain
    rules:
      - "RAG fallback chain intact: Memvid -> FAISS -> no-RAG."
      - "Voice TTS fallback intact: Cartesia -> text-only."
      - "Payments fallback intact: Coinbase CDP AgentKit -> mock crypto payments (Base Sepolia testnet only)."

  - id: thread-safe-payments-and-session-state
    name: Thread-Safe Payments & State Locks
    rules:
      - "Payment state modifications must acquire per-session lock (see src/utils/state_manager.py)."
      - "Distributed session state in FastAPI endpoints must use get_session_store(request) to access request.app.state.session_store dynamically."

  - id: security-scanning-and-secrets
    name: Security Scanning & Secrets Hygiene
    rules:
      - "All user inputs scanned for prompt injection/toxicity and outputs scanned before returning (src/security/)."
      - "Zero hardcoded API keys or credentials in source code, configs, or test files."
      - "Base Sepolia testnet keys only; mainnet CDP keys are strictly forbidden."

  - id: testing-isolation-and-coverage
    name: Test Isolation & External API Mocking
    rules:
      - "Test files (tests/**/*) included in review."
      - "All external APIs (Google GenAI, Cartesia, Coinbase CDP) mocked in tests; zero real network calls."
      - "New features or logic refactors accompanied by unit, integration, or property-based tests."

  - id: fast-api-and-phaser-engine-architecture
    name: FastAPI & Phaser 3 Engine Architecture
    rules:
      - "REST/SSE endpoints mounted under /api/v1/* using Pydantic v2 schemas (src/schemas/) and routers (src/routers/)."
      - "SSE chat streaming endpoints yield viseme animation tags (derive_viseme) for character mouth-flap lip syncing."
